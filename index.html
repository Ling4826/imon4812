<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>หน้าทดลอง</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }
    .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; max-width: 600px; }
    h1 { margin-top: 0; }
    button { padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>สวัสดี — นี่คือ HTML ง่าย ๆ</h1>
    <p>ไฟล์นี้แสดงตัวอย่างโครงสร้างพื้นฐานและปุ่มที่ทำงานด้วย JavaScript เล็กน้อย</p>
    <button id="btn">คลิกฉัน</button>
    <p id="msg"></p>
  </div>

  <script>
    document.getElementById('btn').addEventListener('click', () => {
      const el = document.getElementById('msg');
      el.textContent = 'คุณเพิ่งคลิกปุ่ม — เย่ 🎉';
    });
  </script>
</body>
</html>
